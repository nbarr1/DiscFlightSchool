services:
  training-api:
    build:
      context: ./server
    # Disc-flight jobs currently have an in-process registry, so requests for
    # one job must stay in this sole API worker. Scale only after moving that
    # registry and cancellation signal into the shared durable services.
    command: gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    # The object store has no health condition to wait on (see below), so this
    # can start before it is listening and exit creating its bucket. Retry
    # rather than leaving the stack half-up.
    restart: on-failure
    env_file:
      - ./server/.env.example
    environment:
      # Must be supplied by the operator. Without this override the API key
      # would fall through to the placeholder in the committed .env.example,
      # leaving upload/export/train endpoints open to anyone who has read the
      # repository.
      APP_API_KEY: ${APP_API_KEY:?set APP_API_KEY to a long random secret}
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_BUCKET: disc-flight-school
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ROOT_USER:?set OBJECT_STORAGE_ROOT_USER}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_ROOT_PASSWORD:?set OBJECT_STORAGE_ROOT_PASSWORD}
      OBJECT_STORAGE_SECURE: "false"
      # Empty keeps the existing training-only stack usable. Supply this only
      # to the API process to enable cloud flight tracing.
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
      # Only .env.example set this before, and a shell value cannot override an
      # env_file one, so the limit could not be lowered without editing a
      # committed file. It needs lowering behind a proxy that caps request
      # bodies below it — a free Cloudflare Tunnel cuts off at 100 MB, under
      # this 200 MiB default. Set it below the proxy's cap so an oversized clip
      # gets the server's own 413 instead of a truncated upload.
      DISC_FLIGHT_MAX_UPLOAD_BYTES: ${DISC_FLIGHT_MAX_UPLOAD_BYTES:-209715200}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_started
    volumes:
      - training-data:/app/dataset
      - training-models:/app/models
      - training-exports:/app/exports
      - disc-flight-jobs:/app/disc_flight_jobs

  training-worker:
    build:
      context: ./server
    command: python -m training_server.worker
    # Same as training-api: retry until the object store is listening.
    restart: on-failure
    env_file:
      - ./server/.env.example
    environment:
      # Must be supplied by the operator. Without this override the API key
      # would fall through to the placeholder in the committed .env.example,
      # leaving upload/export/train endpoints open to anyone who has read the
      # repository.
      APP_API_KEY: ${APP_API_KEY:?set APP_API_KEY to a long random secret}
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_BUCKET: disc-flight-school
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ROOT_USER:?set OBJECT_STORAGE_ROOT_USER}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_ROOT_PASSWORD:?set OBJECT_STORAGE_ROOT_PASSWORD}
      OBJECT_STORAGE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_started
      # Not a runtime dependency: this service shares three named volumes with
      # training-api, and Docker populates a fresh volume from the image when
      # it creates the first container that mounts it. Creating both at once
      # races that copy — "failed to mkdir .../labels: file exists" — so wait
      # for training-api to exist before this one is created.
      training-api:
        condition: service_started
    volumes:
      - training-data:/app/dataset
      - training-models:/app/models
      - training-exports:/app/exports

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER} -d ${POSTGRES_DB:?set POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # MinIO's images require an entitlement, so Docker Hub denies minio/minio
  # and minio/mc whether or not the pulling account is authenticated, and this
  # stack could no longer start. s3proxy serves the S3 API over a filesystem
  # backend and enforces the same access key and secret. It is a development
  # and CI object store: a deployment that must keep this data should point
  # OBJECT_STORAGE_* at a real S3 endpoint instead, which needs no code change.
  object-storage:
    image: andrewgaul/s3proxy:4.1.1
    environment:
      S3PROXY_ENDPOINT: http://0.0.0.0:9000
      S3PROXY_AUTHORIZATION: aws-v4
      S3PROXY_IDENTITY: ${OBJECT_STORAGE_ROOT_USER:?set OBJECT_STORAGE_ROOT_USER}
      S3PROXY_CREDENTIAL: ${OBJECT_STORAGE_ROOT_PASSWORD:?set OBJECT_STORAGE_ROOT_PASSWORD}
      JCLOUDS_PROVIDER: filesystem
      JCLOUDS_FILESYSTEM_BASEDIR: /data
    ports:
      - "9000:9000"
    volumes:
      - object-storage-data:/data

  # Publishes training-api over HTTPS without opening a port, managing a
  # certificate, or having a public IP — which is what the Android client needs,
  # since it refuses plain HTTP anywhere but loopback.
  #
  # Off by default: it only starts with `docker compose --profile tunnel up`.
  # Create the tunnel in the Cloudflare dashboard, point its public hostname at
  # http://training-api:8000, then export the token it gives you as
  # CLOUDFLARE_TUNNEL_TOKEN. The token is a credential: keep it in your shell or
  # a secret manager, never in a committed file.
  #
  # The token is deliberately not marked required (${VAR:?...}): compose
  # interpolates every service in this file even when its profile is inactive,
  # so that would break `docker compose up` for everyone not using the tunnel.
  # cloudflared reports the missing token itself.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - training-api
    restart: unless-stopped

volumes:
  postgres-data:
  object-storage-data:
  training-data:
  training-models:
  training-exports:
  disc-flight-jobs:
