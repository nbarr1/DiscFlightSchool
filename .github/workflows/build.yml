name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check required assets
        working-directory: disc_golf_android
        run: |
          for asset in \
            "app/src/main/assets/data/pro_baseline_db.json" \
            "app/src/main/assets/data/knowledge_base.json" \
            "app/src/main/assets/models/disc_detector.tflite"; do
            if [ ! -f "$asset" ]; then
              echo "ERROR: Missing asset: $asset"
              exit 1
            fi
          done
          echo "All assets present."

      - name: Build debug APK
        working-directory: disc_golf_android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: disc-flight-school-debug-${{ github.run_number }}
          path: disc_golf_android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
