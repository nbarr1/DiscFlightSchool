name: Server Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test-server:
    name: Python ${{ matrix.python-version }} server contract tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    env:
      APP_API_KEY: test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installed from requirements-test.txt rather than a hand-written list,
      # so the versions under test cannot drift from the versions production
      # pins. server/test_requirements.py fails the build if they do.
      - name: Install server test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements-test.txt

      - name: Compile server Python modules
        run: |
          python -m py_compile \
            server/main.py \
            server/test_validation.py \
            server/test_http_contracts.py \
            server/test_config.py \
            server/test_storage.py \
            server/test_requirements.py \
            server/test_training_manager.py \
            server/test_durable_storage.py \
            server/test_queue.py \
            server/training_server/*.py

      # No DATABASE_URL/REDIS_URL/OBJECT_STORAGE_* here, so the durable-adapter
      # and queue tests skip themselves (see test_durable_storage.py /
      # test_queue.py) — this job stays fast and needs no service containers.
      - name: Run server unit and contract tests
        run: python -m pytest server

      - name: Validate durable runtime files
        run: python scripts/validate_durable_runtime.py

  test-server-durable:
    name: Durable adapter tests (Postgres + Redis + MinIO)
    runs-on: ubuntu-latest

    env:
      APP_API_KEY: test-key
      DATABASE_URL: postgresql://discflight:discflight@localhost:5432/discflight
      REDIS_URL: redis://localhost:6379/0
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_BUCKET: disc-flight-school
      OBJECT_STORAGE_ACCESS_KEY: ci-test-access-key
      OBJECT_STORAGE_SECRET_KEY: ci-test-secret-key
      OBJECT_STORAGE_SECURE: "false"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: discflight
          POSTGRES_USER: discflight
          POSTGRES_PASSWORD: discflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discflight -d discflight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Not required for access — every image below is public — but an
      # authenticated pull gets a far higher Docker Hub rate limit than a
      # shared runner's IP does, and an anonymous 429 fails the job just as
      # hard as a denial. Both are repository secrets, which a pull request
      # from a fork does not receive, so such a run fails at this step.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # MinIO's images are gated: Docker Hub denies minio/minio and minio/mc
      # to accounts without the entitlement, authenticated or not, so this job
      # could no longer start an object store at all. s3proxy serves the S3
      # API over a filesystem backend and enforces the same access key and
      # secret, so OBJECT_STORAGE_ACCESS_KEY/SECRET still carry weight here.
      # It needs env configuration the `services:` block can't express, so it
      # is started by hand rather than as a service container.
      - name: Start the S3-compatible object store
        run: |
          docker run -d --name object-storage -p 9000:9000 \
            -e S3PROXY_ENDPOINT=http://0.0.0.0:9000 \
            -e S3PROXY_AUTHORIZATION=aws-v4 \
            -e S3PROXY_IDENTITY=ci-test-access-key \
            -e S3PROXY_CREDENTIAL=ci-test-secret-key \
            -e JCLOUDS_PROVIDER=filesystem \
            -e JCLOUDS_FILESYSTEM_BASEDIR=/data \
            andrewgaul/s3proxy:4.1.1
          for i in $(seq 1 30); do
            # An unauthenticated request is answered 403, so any HTTP response
            # proves the listener is up; -f would reject that as a failure.
            if curl -s -o /dev/null http://localhost:9000/; then
              exit 0
            fi
            sleep 1
          done
          echo "The object store did not become reachable in time" >&2
          docker logs object-storage
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install server test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements-test.txt

      - name: Run durable adapter and queue tests
        run: python -m pytest server/test_durable_storage.py server/test_queue.py -v
