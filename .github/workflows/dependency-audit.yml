name: Dependency Audit

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit server dependencies
        run: >-
          python -m pip_audit
          --progress-spinner off
          --format=json
          --output=server-pip-audit.json
          -r server/requirements.txt

      - name: Audit server test dependencies
        run: >-
          python -m pip_audit
          --progress-spinner off
          --format=json
          --output=server-test-pip-audit.json
          -r server/requirements-test.txt

      - name: Audit prototype Python dependencies
        run: >-
          python -m pip_audit
          --progress-spinner off
          --format=json
          --output=prototype-pip-audit.json
          -r disc_golf_app/python/requirements.txt

      - name: Upload pip-audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-reports
          path: |
            server-pip-audit.json
            server-test-pip-audit.json
            prototype-pip-audit.json
          if-no-files-found: ignore

  osv-lockfile-audit:
    name: OSV lockfile audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No pnpm-lock.yaml entry: the repo has no JavaScript source, and the
      # empty lockfile that used to sit at the root was committed by accident.
      - name: Scan lockfiles and manifests
        uses: google/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=disc_golf_app/pubspec.lock
            --lockfile=requirements.txt:server/requirements.txt
            --lockfile=requirements.txt:server/requirements-test.txt
            --lockfile=requirements.txt:disc_golf_app/python/requirements.txt
