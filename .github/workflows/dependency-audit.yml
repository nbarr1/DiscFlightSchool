name: Dependency Audit

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit server dependencies
        run: python -m pip_audit -r server/requirements.txt

      - name: Audit prototype Python dependencies
        run: python -m pip_audit -r disc_golf_app/python/requirements.txt

  osv-lockfile-audit:
    name: OSV lockfile audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan lockfiles and manifests
        uses: google/osv-scanner-action@main
        with:
          scan-args: |-
            --recursive
            .
