name: Dependency Audit

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit server dependencies
        run: >-
          python -m pip_audit
          --progress-spinner off
          --format=json
          --output=server-pip-audit.json
          -r server/requirements.txt

      - name: Audit server test dependencies
        run: >-
          python -m pip_audit
          --progress-spinner off
          --format=json
          --output=server-test-pip-audit.json
          -r server/requirements-test.txt

      - name: Upload pip-audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-reports
          path: |
            server-pip-audit.json
            server-test-pip-audit.json
          if-no-files-found: ignore

# There is no `osv-lockfile-audit` job any more. OSV-scanner needs a real
# lockfile, and the only one this repo ever had was `disc_golf_app/pubspec.lock`,
# which left with the Flutter client. The Android client pins every dependency
# exactly in `disc_golf_android/gradle/libs.versions.toml`, but a version
# catalog is a manifest, not a resolved lockfile, so scanning it would report
# against versions Gradle may never resolve -- the same failure mode the
# comment above describes for the Python requirements files. Restore the job
# alongside Gradle dependency locking (`gradle.lockfile`) if that is turned on.
#
# The Python requirements files stay covered by the pip-audit job above, which
# resolves them the way pip actually does.
