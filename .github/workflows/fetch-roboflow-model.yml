name: Fetch Roboflow Model

permissions:
  contents: read

# Downloads the disc model the Roboflow Workflow runs, for the app to ship.
# Spends no inference credits. The files land in a workflow artifact.
on:
  workflow_dispatch:
  # TEMPORARY: runs once from this branch; removed before review.
  push:
    branches: [claude/project-thread-my7ej4]

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install inference
        run: python -m pip install inference
      - name: Download the model
        env:
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
          MODEL_CACHE_DIR: ${{ runner.temp }}/roboflow-model
        run: python scripts/fetch_roboflow_model.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: roboflow-model
          path: ${{ runner.temp }}/roboflow-model
          if-no-files-found: warn
