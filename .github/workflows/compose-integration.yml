name: Compose Integration

# The image built here bundles ultralytics/torch (~2GB), and this boots the
# full 6-container stack, so it's push-to-main + manual only, not every PR —
# same reasoning as build.yml's APK build. PRs stay covered by the
# fast server-tests.yml jobs.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # minio/minio and minio/mc are no longer served to anonymous pulls, so
      # the image pull below fails with "pull access denied" without
      # credentials. Both are repository secrets, which a pull request from a
      # fork does not receive, so such a run fails at this step rather than at
      # the pull. Either way it cannot reach MinIO, which is the state today.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run compose integration test
        run: ./scripts/test_compose_integration.sh
