name: Release Build

permissions:
  contents: read

# Two jobs. `release-build-check` builds the minified release bundle on every
# PR and push to main, signed with a throwaway key, so an R8 or resource-
# shrinking break shows up here instead of on a tester's phone: debug builds
# never run R8. `signed-bundle` is manual and produces the bundle to upload to
# Google Play, signed with the real upload key from repository secrets.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  release-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The release build refuses to run without a signing config. This key
      # exists only for this job and signs nothing anyone installs.
      - name: Create a throwaway signing key
        working-directory: disc_golf_android
        run: |
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/throwaway.jks" -alias throwaway \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass throwaway -keypass throwaway \
            -dname "CN=CI throwaway"
          cat > key.properties <<PROPS
          storeFile=$RUNNER_TEMP/throwaway.jks
          storePassword=throwaway
          keyAlias=throwaway
          keyPassword=throwaway
          PROPS

      - name: Build minified release bundle
        working-directory: disc_golf_android
        run: ./gradlew --no-daemon :app:bundleRelease

  signed-bundle:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # RELEASE_KEYSTORE_BASE64 is the upload keystore, base64-encoded
      # (`base64 -w0 upload.jks`). Keep the keystore itself out of the repo.
      - name: Restore the upload key
        working-directory: disc_golf_android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              exit 1
            fi
          done
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          PROPS

      - name: Build signed release bundle
        working-directory: disc_golf_android
        env:
          DFS_CLIENT_API_KEY: ${{ secrets.CLIENT_API_KEY }}
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: disc-flight-school-release-${{ github.run_number }}
          path: disc_golf_android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" disc_golf_android/key.properties
