# Weekly update PRs for every dependency ecosystem in the repo: the Android
# app's Gradle dependencies and the workflows' actions.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /disc_golf_android
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
